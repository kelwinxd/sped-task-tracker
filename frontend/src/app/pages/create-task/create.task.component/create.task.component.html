<div>
   <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col w-[80%] md:w-[500px] mt-5 mx-auto bg-white px-5 py-5 rounded-2xl">
        <h2 class="font-semibold text-3xl mb-2 text-first">Criar Tarefa</h2>
        <label>Titulo</label>
        <input type="text" formControlName="titulo" maxlength="30"/>
        <p *ngIf="form.get('titulo')?.invalid && form.get('titulo')?.touched" class="text-red-400">
        Campo Invalido!
        </p>
        <label>Descrição</label>
        <input type="text" formControlName="descricao" maxlength="70" />
        <p *ngIf="form.get('descricao')?.invalid && form.get('descricao')?.touched" class="text-red-400">
        Campo Invalido!
        </p>
        <button type="submit" class="btn-form mt-5" [disabled]="form.invalid">Criar</button>
   </form>
</div>
